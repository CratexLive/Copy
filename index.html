      "12": { name: "Star Select 2", url: "https://sonucdn-v2.pages.dev/star?id=SE2" },
      "13": { name: "Star Select 2 HD", url: "https://sonucdn-v2.pages.dev/star?id=SE2HD" },
      "14": { name: "Star 1 Tamil SD", url: "https://sonucdn-v2.pages.dev/star?id=T1SD" },
      "15": { name: "Star 1 Tamil HD", url: "https://sonucdn-v2.pages.dev/star?id=T1HD" },
      "16": { name: "Star 1 Telugu SD", url: "https://sonucdn-v2.pages.dev/star?id=TE1SD" },
      "17": { name: "Star 1 Telugu HD", url: "https://sonucdn-v2.pages.dev/star?id=TE1HD" },
      "18": { name: "Star 1 Kannada SD", url: "https://sonucdn-v2.pages.dev/star?id=KA1SD" },
      "19": { name: "Star 2 Tamil SD", url: "https://sonucdn-v2.pages.dev/star?id=T2SD" },
      "20": { name: "Star 2 Tamil HD", url: "https://sonucdn-v2.pages.dev/star?id=S2HD" },
      "21": { name: "Star 2 Telugu SD", url: "https://sonucdn-v2.pages.dev/star?id=TE2SD" },
      "22": { name: "Star 2 Telugu HD", url: "https://sonucdn-v2.pages.dev/star?id=TE2HD" },
      "23": { name: "Star 2 Kannada SD", url: "https://sonucdn-v2.pages.dev/star?id=KA2SD" },

      // Sony Sports Category (Sonucdn)
      "24": { name: "Sony Ten 1", url: "https://sonucdn-v2.pages.dev/star?id=STEN1" },
      "25": { name: "Sony Ten 2", url: "https://sonucdn-v2.pages.dev/star?id=STEN2" },
      "26": { name: "Sony Ten 3", url: "https://sonucdn-v2.pages.dev/star?id=STEN3" },
      "27": { name: "Sony Ten 4 Tamil", url: "https://sonucdn-v2.pages.dev/star?id=STENT" },
      "28": { name: "Sony Ten 4 Telugu", url: "https://sonucdn-v2.pages.dev/star?id=STENTU" },
      "29": { name: "Sony Ten 5", url: "https://sonucdn-v2.pages.dev/star?id=STEN5" },
      "30": { name: "Sony Ten 1 HD", url: "https://sonucdn-v2.pages.dev/star?id=STEN1HD" },
      "31": { name: "Sony Ten 2 HD", url: "https://sonucdn-v2.pages.dev/star?id=STEN2HD" },
      "32": { name: "Sony Ten 3 HD", url: "https://sonucdn-v2.pages.dev/star?id=STEN3HD" },
      "33": { name: "Sony Ten 5 HD", url: "https://sonucdn-v2.pages.dev/star?id=STEN5HD" },

      // Movies / Entertainment Category (Sonucdn)
      "34": { name: "Sony SET HD", url: "https://sonucdn-v2.pages.dev/star?id=SETHD" },
      "35": { name: "Sony Max HD", url: "https://sonucdn-v2.pages.dev/star?id=SMAX" }
    };

    this.currentChannelId = "2"; // Default to Star Sports 1 HD
    const urlParams = new URLSearchParams(window.location.search);
    const sharedId = urlParams.get('id');
    if (sharedId && this.CHANNELS[sharedId]) {
      this.currentChannelId = sharedId;
    }

    this.CONFIG = {
      telegramLink: "https://t.me/+xSqMXDXp78ZiOWQ1",
      streamManifest: this.CHANNELS[this.currentChannelId].url,
    };

    this.lockTimer = null;
    this.PREVIEW_TIME = 5 * 60 * 1000;
    this.animationFrameId = null;
    this.stars = [];
    this.boundResize = () => {
      const canvas = this._shadow.getElementById('warpGridCanvas');
      if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    };

    this.msgHandler = (e) => {
      if (e.data === 'cricxcrate-fs-enter') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.add('fs-active');
          try {
            if (rig.requestFullscreen) rig.requestFullscreen().catch(()=>{});
            else if (rig.webkitRequestFullscreen) rig.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
          } catch(err){}
        }
      } else if (e.data === 'cricxcrate-fs-exit') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.remove('fs-active');
          try {
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch(err){}
        }
      }
    };

    this.nativeFsHandler = () => {
       const rig = this._shadow.getElementById('playerContainer');
       if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (rig) rig.classList.remove('fs-active');
       }
    };
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name === 'stream-url' && oldValue !== newValue && newValue) {
      this.CONFIG.streamManifest = newValue;
      this.setupIframePlayer();
    }
  }

  async connectedCallback() {
    await this.render();
    this.initWarpField();
    this.initThemeSwitching();
    this.initEventListeners();
    this.setupIframePlayer();

    const targetBtn = this._shadow.querySelector(`[data-chid="${this.currentChannelId}"]`);
    if (targetBtn) {
      const allBtns = this._shadow.querySelectorAll('.channel-btn');
      allBtns.forEach(b => b.classList.remove('active'));
      targetBtn.classList.add('active');
      
      const parentGrid = targetBtn.closest('.channel-grid');
      if (parentGrid) {
        const gridId = parentGrid.id;
        const tabs = this._shadow.querySelectorAll('.cat-tab');
        tabs.forEach(t => {
          if (t.getAttribute('data-target') === gridId) {
            t.classList.add('active');
            parentGrid.classList.add('active');
          } else {
            t.classList.remove('active');
          }
        });
      }
      
      const titleElem = this._shadow.getElementById('currentChannelTitle');
      if (titleElem) {
        titleElem.textContent = `${this.CHANNELS[this.currentChannelId].name} · Live Broadcast`;
      }
    }

    window.addEventListener('message', this.msgHandler);
    document.addEventListener('fullscreenchange', this.nativeFsHandler);
    document.addEventListener('webkitfullscreenchange', this.nativeFsHandler);

    setTimeout(() => {
      const modal1 = this._shadow.getElementById('tgModalOne');
      if (modal1) modal1.classList.add('show');
    }, 1000);

    this.check5MinLockStatus();
  }

  disconnectedCallback() {
    if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
    if (this.lockTimer) clearTimeout(this.lockTimer);
    window.removeEventListener('resize', this.boundResize);
    window.removeEventListener('message', this.msgHandler);
    document.removeEventListener('fullscreenchange', this.nativeFsHandler);
    document.removeEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }
  async render() {
    this._shadow.innerHTML = `
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

      <style>

          --primary-rgb: 255, 2, 102;

          --accent-glow-intense: rgba(255, 2, 102, 0.6);
          --bg-pure: #fbf0f4;
          --bg-card: rgba(255, 255, 255, 0.88);
          --border-glass: rgba(0, 0, 0, 0.06);
          --border-glass-bright: rgba(255, 2, 102, 0.25);
          --heading-dynamic: #1a050d;
          --text-main: #2d0a16;
          --text-muted: #8a5a6b;
          --text-dark: #b88a9a;
          --btn-main-bg: #1a050d;
          --btn-main-text: #ffffff;
          --player-shadow: 0 30px 80px -20px rgba(255, 2, 102, 0.15);
          display: block; position: relative; width: 100%; min-height: 100vh;
          background: radial-gradient(circle at 50% 0%, rgba(255, 2, 102, 0.08) 0%, transparent 65%), var(--bg-pure);
          color: var(--text-main); font-family: 'Manrope', sans-serif; overflow-x: hidden;
          font-size: clamp(14px, 0.8vw + 0.45rem, 22px); box-sizing: border-box;
        }

        :host([data-theme="dark"]) {
          --primary-rgb: 255, 2, 102;
          --accent: #FF0266;
          --accent-glow: rgba(255, 2, 102, 0.35);
          --accent-glow-intense: rgba(255, 2, 102, 0.75);
          --bg-pure: #09131c; 
          --bg-card: rgba(24, 32, 45, 0.75);
          --border-glass: rgba(255, 2, 102, 0.16);
          --border-glass-bright: rgba(255, 2, 102, 0.4);

        }

  check5MinLockStatus() {
    const savedTime = localStorage.getItem('cricxcrate_24hr_unlocked');
    const twentyFourHours = 24 * 60 * 60 * 1000;

    if (savedTime && (Date.now() - parseInt(savedTime, 10) < twentyFourHours)) {
      return;
    }

    this.lockTimer = setTimeout(() => {
      const lockOverlay = this._shadow.getElementById('playerLockOverlay');
      if (lockOverlay) lockOverlay.classList.add('show');
    }, this.PREVIEW_TIME);
  }

  unlockStream24Hr() {
    localStorage.setItem('cricxcrate_24hr_unlocked', Date.now().toString());
    const lockOverlay = this._shadow.getElementById('playerLockOverlay');
    if (lockOverlay) lockOverlay.classList.remove('show');
  }

  initEventListeners() {
    const btnShare = this._shadow.getElementById("btnShare");
    const shareBtnText = this._shadow.getElementById("shareBtnText");
    const tgCloseBtn1 = this._shadow.getElementById("tgCloseBtn1");
    const tgNextBtn1 = this._shadow.getElementById("tgNextBtn1");
    const tgCloseBtn2 = this._shadow.getElementById("tgCloseBtn2");
    const tgUnlockBtn = this._shadow.getElementById("tgUnlockBtn");
    const categoryTabs = this._shadow.getElementById("categoryTabs");

    if (tgCloseBtn1) {
      tgCloseBtn1.addEventListener("click", () => {
        const modal1 = this._shadow.getElementById('tgModalOne');
        if (modal1) modal1.classList.remove('show');
      });
    }

    if (tgNextBtn1) {
      tgNextBtn1.addEventListener("click", () => {
        const modal1 = this._shadow.getElementById('tgModalOne');
        const modal2 = this._shadow.getElementById('tgModalTwo');
        if (modal1) modal1.classList.remove('show');
        if (modal2) modal2.classList.add('show');
      });
    }

    if (tgCloseBtn2) {
      tgCloseBtn2.addEventListener("click", () => {
        const modal2 = this._shadow.getElementById('tgModalTwo');
        if (modal2) modal2.classList.remove('show');
      });
    }

    if (tgUnlockBtn) {
      tgUnlockBtn.addEventListener("click", () => this.unlockStream24Hr());
    }

    if (categoryTabs) {
      categoryTabs.addEventListener("click", (e) => {
        if (e.target.classList.contains('cat-tab')) {
          const tabs = categoryTabs.querySelectorAll('.cat-tab');
          tabs.forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');

          const targetId = e.target.getAttribute('data-target');
          const grids = this._shadow.querySelectorAll('.channel-grid');
          grids.forEach(g => {
            if (g.id === targetId) {
              g.classList.add('active');
            } else {
              g.classList.remove('active');
            }
          });
        }
      });
    }

    const container = this._shadow.querySelector('.channel-grids-container');
    if (container) {
      container.addEventListener("click", (e) => {
        if (e.target.classList.contains('channel-btn')) {
          const allButtons = container.querySelectorAll('.channel-btn');
          allButtons.forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');

          const channelId = e.target.getAttribute('data-chid');
          if (this.CHANNELS[channelId]) {
            this.currentChannelId = channelId;
            const channelObj = this.CHANNELS[channelId];
            this.CONFIG.streamManifest = channelObj.url;

            const iframe = this._shadow.getElementById('player');
            if (iframe) {
              iframe.src = channelObj.url;
            }

            const titleElem = this._shadow.getElementById('currentChannelTitle');
            if (titleElem) {
              titleElem.textContent = `${channelObj.name} · Live Broadcast`;
            }

            const newRelativePathQuery = window.location.pathname + '?id=' + channelId;
            history.pushState(null, '', newRelativePathQuery);
          }
        }
      });
    }

    if (btnShare) {
      btnShare.addEventListener("click", async () => {
        const currentShareUrl = window.location.origin + window.location.pathname + '?id=' + this.currentChannelId;
        const activeChannelName = this.CHANNELS[this.currentChannelId].name;
        
        const shareData = {
          title: activeChannelName,
          text: `${activeChannelName}\n`,
          url: currentShareUrl
        };
        try {
          if (navigator.share && /mobile|android|iphone|ipad|tablet/i.test(navigator.userAgent)) {
            await navigator.share(shareData);
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(`${activeChannelName}: ${currentShareUrl}`);
            const originalText = shareBtnText.textContent;
            shareBtnText.textContent = "LINK COPIED!";
            setTimeout(() => { shareBtnText.textContent = originalText; }, 1800);
          }
        } catch (err) {}
      });
    }
  }
  setupIframePlayer() {
    const iframe = this._shadow.getElementById('player');
    const streamUrl = this.CONFIG.streamManifest;
    if (iframe) iframe.src = streamUrl;
  }
  initWarpField() {
    const canvas = this._shadow.getElementById('warpGridCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    this.stars = [];
    const starCount = Math.min(100, Math.floor(window.innerWidth / 12));
    
    window.addEventListener('resize', this.boundResize);
    this.boundResize();

    for (let i = 0; i < starCount; i++) {
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: (Math.random() * 20 + 8) * this.SENSITIVITY * 0.8,
        speed: (Math.random() * 2.0 + 1.0) * this.SENSITIVITY,
        alpha: Math.random() * 0.4 + 0.1
      });
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.0;
      this.stars.forEach(star => {
        ctx.strokeStyle = `rgba(255, 2, 102, ${star.alpha})`; 
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x + star.length, star.y);
        ctx.stroke();
        star.x += star.speed;
        if (star.x > canvas.width) {
          star.x = -star.length;
          star.y = Math.random() * canvas.height;
        }
      });
      this.animationFrameId = requestAnimationFrame(render);
    };
    render();
  }

  initThemeSwitching() {
    const darkBtn = this._shadow.getElementById("themeDarkBtn");
    const lightBtn = this._shadow.getElementById("themeLightBtn");
    if (!darkBtn || !lightBtn) return;
    
    lightBtn.classList.add("active");
    darkBtn.classList.remove("active");

    const setTheme = (mode) => {
      if (mode === "dark") {
        this.setAttribute("data-theme", "dark");
        darkBtn.classList.add("active");
        lightBtn.classList.remove("active");
      } else {
        this.removeAttribute("data-theme");
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
      }
    };
    darkBtn.addEventListener("click", () => setTheme("dark"));
    lightBtn.addEventListener("click", () => setTheme("light"));
  }
}
